<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NBA Dream League</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#121820">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Dream League">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Racing+Sans+One&display=swap">
<style>
/* Layout: app a una colonna, barra a tab in basso, "tabellone" in alto per asta e sfide */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E3E8EE; --line:#D3DAE2;
  --ink:#121820; --muted:#5A6676; --accent:#E35A12; --accent-ink:#FFFFFF;
  --mine:#1F5FD1; --win:#13804B; --loss:#C2342B; --warn:#B7791F;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --board:#121820; --board-ink:#F1F4F8;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171C24; --surface2:#1F2630; --line:#2A3340;
  --ink:#E9EDF2; --muted:#8C97A6; --accent:#FF7A2E; --accent-ink:#1A0D05;
  --mine:#6EA1FF; --win:#3DD68C; --loss:#FF6B61; --warn:#F2B84B; --board:#07090C; --board-ink:#F1F4F8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171C24; --surface2:#1F2630; --line:#2A3340;
  --ink:#E9EDF2; --muted:#8C97A6; --accent:#FF7A2E; --accent-ink:#1A0D05;
  --mine:#6EA1FF; --win:#3DD68C; --loss:#FF6B61; --warn:#F2B84B; --board:#07090C; --board-ink:#F1F4F8; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
/* barra classifica che scorre (stile TV) */
.tk{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#E35A12,#FF7A2E);color:#fff;font-family:var(--display);font-size:15px;padding-top:env(safe-area-inset-top,0px);cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tk .bar{position:relative;height:34px;overflow:hidden}
.tk .lab{position:absolute;left:0;top:0;bottom:0;z-index:2;background:#121820;padding:0 10px;display:flex;align-items:center;gap:6px;font-weight:900;letter-spacing:.08em;font-size:14px;box-shadow:6px 0 10px rgba(0,0,0,.25)}
.tk .lab i{width:8px;height:8px;border-radius:50%;background:#FF4136;animation:tkbl 1s infinite}
@keyframes tkbl{50%{opacity:.2}}
.tk .run{display:inline-flex;height:34px;align-items:center;white-space:nowrap;animation:tkrun var(--dur,30s) linear infinite;will-change:transform}
@keyframes tkrun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk .it{display:inline-flex;gap:6px;align-items:center;height:34px;padding:0 12px;border-left:1px solid rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.tk .it.me{background:rgba(18,24,32,.3)}
.tk .it .nm{font-weight:600}
.tk .pill{background:rgba(0,0,0,.22);border-radius:6px;padding:1px 6px;font-size:13px;font-weight:800}
.tk .pill.up{background:#13804B}.tk .pill.dn{background:#B3261E}
@media (prefers-reduced-motion:reduce){.tk .run{animation:none}.tk .bar{overflow-x:auto}}
body.has-tk .wrap{padding-top:10px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:96px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:2.4rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn.primary .muted{color:inherit;opacity:.8}
.btn.ghost{background:transparent}
.btn.danger{color:var(--loss);border-color:var(--loss);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:44px;width:100%;font-size:16px}
button,a,.tab{touch-action:manipulation}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.chip.bc{color:var(--mine);border-color:color-mix(in srgb,var(--mine) 45%,transparent)}
.chip.fc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.inj{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 50%,transparent)}
.chip.dtd{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.chip.win{color:var(--win);border-color:color-mix(in srgb,var(--win) 50%,transparent)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface2);object-fit:cover;flex:none}
.avatar.lg{width:84px;height:84px}

/* testata */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
.who{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.who b{color:var(--mine)}
.sub{color:var(--muted);margin:-6px 0 12px;font-size:.95rem}
.brand{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:.9;letter-spacing:.02em}
.brand b{color:var(--accent)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:720px}
.tab{background:none;border:0;padding:10px 2px 9px;font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.03em;color:var(--muted);cursor:pointer;text-transform:uppercase;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;left:22%;right:22%;top:0;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.tab .dot{position:absolute;top:8px;right:18%;width:8px;height:8px;border-radius:50%;background:var(--loss)}
.tab .badge{position:absolute;top:4px;right:10%;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--loss);color:#fff;font:700 .7rem/18px var(--body);letter-spacing:0}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.tlogo{flex:none;display:inline-block;vertical-align:middle;border-radius:50%;object-fit:cover}
svg.tlogo{border-radius:0}
.owner{font-weight:500;color:var(--muted);font-size:.85em}
.injline{font-size:.8rem;color:var(--loss);margin-top:2px}
.injline a{color:inherit;font-weight:700;display:inline-block;padding:6px 4px;margin:-6px 0}
.prow{display:grid;grid-template-columns:auto auto 1fr auto;column-gap:8px;row-gap:6px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pn{font-weight:700;line-height:1.2}
.prow .pq{text-align:right}
.prow .pq .v{font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1}
.prow .pa{grid-column:2 / -1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.prow .pa:empty{display:none}
.alert{border:2px solid var(--loss);background:color-mix(in srgb,var(--loss) 8%,var(--surface));border-radius:var(--r);padding:12px 14px}
.alert.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}

/* tabellone */
.board{background:var(--board);color:var(--board-ink);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.board .label{color:color-mix(in srgb,var(--board-ink) 62%,transparent)}
.board .big{font-family:var(--display);font-weight:900;font-size:4.2rem;line-height:.85;font-variant-numeric:tabular-nums}
.board .mid{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.timerbar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--board-ink) 18%,transparent);overflow:hidden;margin-top:12px}
.timerbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.board.hot .timerbar i{background:var(--loss)}
.secs{font-family:var(--display);font-weight:900;font-size:2.2rem;font-variant-numeric:tabular-nums;line-height:1}

/* sfide */
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.match:first-child{border-top:0}
.match .t{min-width:0}
.match .t.r{text-align:right}
.match .score{font-family:var(--display);font-weight:900;font-size:1.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.match .lead{color:var(--accent)}
.mine-name{color:var(--mine)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0;font-weight:600}
th:first-child,td:first-child{text-align:left}
td.team{white-space:normal}
tr.cut td{border-top:2px dashed var(--accent)}
.scroll{overflow-x:auto}

/* formazione */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:6px 10px;min-height:34px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.p{background:var(--surface2);color:var(--ink)}
.star{border:0;background:none;font-size:1.35rem;line-height:1;cursor:pointer;color:var(--line);padding:0;min-width:40px;min-height:44px;display:grid;place-items:center;flex:none}
.star.on{color:var(--accent)}
.daypick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daypick button{flex:none}
/* quintetto: campo in parquet */
.lu{background:#0E1116;color:#F1F4F8;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.lu-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 12px 10px}
.lu-stats div{background:#171C24;border:1px solid #2A3340;border-radius:10px;padding:7px 4px;text-align:center;min-width:0}
.lu-stats b{display:block;font:900 22px/1.05 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-stats b.y{color:#FFD23F;font-size:19px;line-height:23px}.lu-stats b.g{color:#3DD68C}.lu-stats b.r{color:#FF6B61}
.lu-stats small{font:800 10.5px var(--body);color:#8C97A6;letter-spacing:.06em;text-transform:uppercase}
.lu-hint{padding:8px 14px;font-size:.85rem;color:#FFB27A;font-weight:700;text-align:center;background:#1F2630}
.lu-hint.bad{color:#FF8A80}
.lu-court{position:relative;height:420px;perspective:700px;overflow:hidden}
.lu-floor{position:absolute;left:-90px;right:-90px;top:-150px;bottom:-30px;transform:rotateX(24deg);transform-origin:50% 100%;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 26px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 120px),linear-gradient(180deg,#D9A66B,#C98F55 60%,#B97D45)}
.lu-floor svg{position:absolute;inset:0;width:100%;height:100%}
.lu button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lu .ph{display:block;width:68px;height:68px;margin:0 auto;border-radius:50%;border:3px solid #fff;background:#121820;overflow:hidden;padding:0;box-shadow:0 8px 14px rgba(0,0,0,.45);position:relative}
.lu .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.lu .ph .ini{display:grid;place-items:center;height:100%;font:900 22px var(--display)}
.pc{position:absolute;width:31%;max-width:118px;transform:translateX(-50%);text-align:center}
.pcard{display:block;width:100%;margin-top:-8px;position:relative;background:#121820;border:0;border-radius:8px;overflow:hidden;padding:0;box-shadow:0 6px 12px rgba(0,0,0,.4)}
.pcard .n{font:800 15px var(--display);padding:5px 4px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.pcard .n i{font-style:normal;font-size:11px;padding:1px 4px;border-radius:3px;margin-right:4px;vertical-align:2px}
.pcard .n i.bc{background:#6EA1FF;color:#08142c}.pcard .n i.fc{background:#FF9A5C;color:#2a1103}
.pcard .r{display:grid;grid-template-columns:1fr 1fr;background:#fff;color:#121820}
.pcard .r div{padding:4px 0 3px;line-height:1;min-width:0}
.pcard .r b{font:900 17px/1 var(--display)}.pcard .r b.sm{font-size:13.5px;white-space:nowrap}
.pcard .r small{display:block;font:800 9px var(--body);color:#5A6676;letter-spacing:.05em;margin-top:2px}
.pcard .bar{height:3px;background:#3DD68C}.lu .bar.warn,.lu .bi.warn{background:#F2B84B}.lu .bar.bad,.lu .bi.bad{background:#FF6B61}
.pc.sel .ph,.bp.sel .ph{outline:3px solid var(--accent);outline-offset:3px}
.pc.sel .pcard{box-shadow:0 0 0 3px var(--accent),0 6px 12px rgba(0,0,0,.4)}
.pcap,.px{position:absolute;top:-6px;width:30px;height:30px;border-radius:50%;padding:0;z-index:2;font:900 14px/1 var(--display)!important;display:grid;place-items:center}
.pcap{right:calc(50% - 54px);border:2px solid rgba(255,255,255,.6);background:#121820;color:rgba(255,255,255,.7)}
.pcap.on{background:#FFD23F;color:#121820;border-color:#FFD23F}
.px{left:calc(50% - 54px);border:0;background:#fff;color:#121820!important;font:900 18px/1 var(--body)!important}
.pc.empty .ph{border:2px dashed rgba(255,255,255,.8);background:rgba(0,0,0,.25);color:#fff;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:none}
.pc.empty .pcard{background:rgba(18,24,32,.7)}
.lu-coach{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#171C24;border-bottom:1px solid #2A3340}
.lu-coach.on{background:linear-gradient(90deg,rgba(61,214,140,.18),#171C24)}
.lu-coach .tx{flex:1;min-width:0}.lu-coach b{display:block;font:800 17px var(--display);letter-spacing:.02em}
.lu-coach small{font-size:.78rem;color:#9AA6B5;font-weight:600}
.lu .sw{flex:none;width:56px;height:32px;border-radius:999px;border:0;background:#3a4656;position:relative;padding:0;transition:background .2s}
.lu .sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.lu .sw.on{background:#13804B}.lu .sw.on i{left:27px}
.lu-caps{background:#171C24;border-top:1px solid #2A3340;padding:10px 12px 12px}
.lu-caps .t{display:flex;justify-content:space-between;font:800 12px var(--display);letter-spacing:.12em;color:#8C97A6}
.lu-caps .t .bad{color:#FF8A80}.lu-caps .t .ok{color:#3DD68C}
.lu-caps .why{margin:6px 0 8px;font-size:.82rem;line-height:1.35;color:#C9D1DB}
.lu-caps .why b{color:#FFD23F}
.lu-caps .cr{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:10px;margin-top:4px;background:#1F2630}
.lu-caps .cr.on{background:rgba(255,210,63,.14);box-shadow:inset 0 0 0 1px rgba(255,210,63,.5)}
.lu-caps .cn{width:30px;height:30px;flex:none;border-radius:50%;background:#2A3340;display:grid;place-items:center;font:900 13px var(--display)}
.lu-caps .cr.on .cn{background:#FFD23F;color:#121820}
.lu .ph.sm{width:34px;height:34px;border-width:2px;margin:0;flex:none;box-shadow:none}
.lu-caps .cx{flex:1;min-width:0;line-height:1.15}.lu-caps .cx b{font:800 15px var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-caps .cx small{font-size:.72rem;color:#8C97A6;font-weight:700}
.lu-caps .cr button{width:34px;height:34px;flex:none;border-radius:8px;border:1px solid #3a4656;background:#121820;color:#fff;font-weight:800;padding:0}
.lu-caps .cr button:disabled{opacity:.3}
.lu-caps .add{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:.8rem;color:#8C97A6;font-weight:700}
.lu-caps .add button{border:1px dashed #4a5768;background:none;color:#C9D1DB;border-radius:999px;padding:5px 10px;font:700 .8rem var(--body)}
.pcap.lst{background:#121820;color:#FFD23F;border-color:#FFD23F}
.lu-save{background:#171C24;padding:0 12px 14px}
.lu-save:empty{display:none}
.lu-bench{background:#171C24;border-top:1px solid #2A3340;padding:10px 0 12px}
.lu-bench .t{display:flex;justify-content:space-between;padding:0 14px 8px;font:800 12px var(--display);letter-spacing:.12em;color:#8C97A6}
.lu-bench .row-b{display:flex;gap:8px;padding:4px 14px 0;overflow-x:auto;scrollbar-width:none}
.lu-bench .row-b::-webkit-scrollbar{display:none}
.bp{flex:none;width:68px;text-align:center;background:none;border:0;padding:0;position:relative}
.bp .ph{width:54px;height:54px;border-width:2px}
.bp .bn{position:absolute;left:2px;top:-4px;width:20px;height:20px;border-radius:50%;background:#2A3340;color:#fff;font:800 12px/20px var(--display);z-index:1}
.bp .bi{position:absolute;right:6px;top:0;width:12px;height:12px;border-radius:50%;border:2px solid #171C24;z-index:1}
.bp .nm{font:800 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.bp .sm{font-size:10.5px;color:#8C97A6;font-weight:700;white-space:nowrap}
@media (max-width:350px){.lu .ph{width:58px;height:58px}.pcard .n{font-size:13.5px}.pcard .r b{font-size:15px}}
.sticky-save{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5}

function renderTicker() {
  const el = $("#ticker");
  if (!S.sess || !S.league || S.teams.length < 2) { el.hidden = true; document.body.classList.remove("has-tk"); return; }
  const tr = new Map(S.trend.map((x) => [x.team_id, x]));
  const byName = (a, b) => a.name.localeCompare(b.name);
  let items, label;
  if (!S.trend.length) {
    // prima della stagione: crediti rimasti e giocatori presi

    const size = +(R().roster || {}).size || 10;
    items = [...S.teams].map((t) => ({ t, rk: "", main: credits(t.id) + " cr", pill: rosterOf(t.id).length + "/" + size, cls: "" }));
  } else if (S.league.mode === "h2h") {
    label = S.tkLive ? "<i></i>LIVE" : "CLASSIFICA";
    const st = new Map(S.standings.map((x) => [x.team_id, x]));
    const rows = [...S.teams].sort((a, b) => { const x = st.get(a.id) || {}, y = st.get(b.id) || {}; return ((y.wins || 0) - (y.losses || 0)) - ((x.wins || 0) - (x.losses || 0)) || (+y.total_points || 0) - (+x.total_points || 0) || byName(a, b); });
    items = rows.map((t, i) => { const x = st.get(t.id) || {}, l = +(tr.get(t.id)?.last_pts || 0);
      return { t, rk: i + 1 + "°", main: `${x.wins || 0}-${x.losses || 0}`, pill: (l > 0 ? "+" : "") + fmt1(l), cls: "" }; });
  } else {

    const now = [...S.teams].sort((a, b) => tot(b) - tot(a) || byName(a, b));

      return { t, rk: i + 1 + "°", main: fmt1(tot(t)), pill: mv > 0 ? "▲" + mv : mv < 0 ? "▼" + -mv : "=", cls: mv > 0 ? "up" : mv < 0 ? "dn" : "" }; });

  const html = `<div class="bar"><span class="lab">${label}</span><div class="run" style="--dur:${Math.max(16, items.length * 4)}s;padding-left:0">${one}${one}</div></div>`;

function subscribe() {

          && prev.current_team_id === S.sess.team_id && p.new.current_team_id !== S.sess.team_id) {

    .on("postgres_changes", { event: "*", schema: "public", table: "roster", filter: f }, () => soon(async () => { S.roster = await q(sb.from("roster").select("*").eq("league_id", id).not("team_id", "is", null)); render(); }))

      try { store.set("fantanba.lastcode", res.code); } catch {}
      await loadLeague(); subscribe(); await loadMyStarters(); S.tab = S.league.status === "auction" ? "asta" : "oggi"; render();
      if (res.created) toast("Lega creata. Codice: " + res.code);

    go(() => rpc("login", { p_code: v("lg-code"), p_team_name: team, p_pin: v("lg-pin") }));

}

/* ---------- OGGI ---------- */
async function gameDays() {
  if (!gameDays.cache) {
    const rows = await q(sb.from("game_days").select("game_date").gte("game_date", "2026-10-01").order("game_date").limit(1000));
    gameDays.cache = rows.map((r) => r.game_date);
  }
  return gameDays.cache;
}
function nearestDay(days, from) { return days.find((d) => d >= from) || days[days.length - 1] || from; }

async function oggiView() {
  const days = await gameDays();

    const { data: last } = await sb.from("games").select("game_date").gte("game_date", from).in("state", ["in", "post"]).order("game_date", { ascending: false }).limit(1);
    const lastDay = last?.[0]?.game_date;
    const yest = new Date(new Date(today + "T12:00:00Z").getTime() - 864e5).toISOString().slice(0, 10);

      ${games.length ? `<div class="list">${games.map((g) => `<div class="item"><span class="grow num"><b>${esc(g.away_abbr)}</b> ${g.state === "pre" ? "" : g.away_score} <span class="muted">@</span> <b>${esc(g.home_abbr)}</b> ${g.state === "pre" ? "" : g.home_score}</span><span class="muted">${g.state === "pre" ? fmtTime(g.start_time) : esc(g.status_detail || "")}</span></div>`).join("")}</div>` : '<div class="empty">Nessuna partita</div>'}
    </section>

function detailBox(s, teamId) {

/* ---------- QUINTETTO ---------- */
async function formazioneView() {
  const ro = R().roster || {};
  const mine = rosterOf(S.sess.team_id).map((r) => ({ ...P(r.player_id), price: r.price }));
  if (!mine.length) return head("Quintetto") + `<section class="card"><div class="empty">La tua rosa è vuota. I giocatori arrivano dall'asta.</div></section>`;
  const days = await gameDays(), today = etToday();
  const upcoming = days.filter((d) => d >= today).slice(0, 10);
  if (!S.lineupDate || !upcoming.includes(S.lineupDate)) { S.lineupDate = upcoming[0]; S.lineup = null; }
  const d = S.lineupDate;
  // orari in memoria per 60 s: toccare i giocatori ridisegna subito, senza aspettare la rete
  const gc = (formazioneView.gc ||= {});
  if (d && (!gc[d] || Date.now() - gc[d].at > 60000)) gc[d] = { at: Date.now(), rows: await q(sb.from("games").select("*").eq("game_date", d)) };
  const games = d ? gc[d].rows : [];
  const opp = new Map();
  for (const g of games) { opp.set(g.home_abbr, { s: "vs " + g.away_abbr, t: g.start_time }); opp.set(g.away_abbr, { s: "@ " + g.home_abbr, t: g.start_time }); }
  const deadline = games.length ? games.map((g) => g.start_time).sort()[0] : null;
  const locked = deadline && now() >= new Date(deadline).getTime();
  const auto = !!me()?.auto_coach, noEdit = locked || auto; // non modificabile a mano
  S.luRO = noEdit;

  if (!S.lineup || S.lineup.date !== d) {
    const rows = await q(sb.from("lineups").select("*").eq("team_id", S.sess.team_id).lte("game_date", d).order("game_date", { ascending: false }).limit(1));
    const l = rows[0];
    const own = new Set(mine.map((p) => p.id));
    S.lineup = { date: d, starters: (l?.starters || []).filter((x) => own.has(x)), bench: (l?.bench || []).filter((x) => own.has(x)), captains: ((l?.captains?.length ? l.captains : l?.captain ? [l.captain] : [])).filter((x) => own.has(x)), savedFor: l?.game_date || null };
  }
  const L = S.lineup, N = +ro.starters || 5;
  const st = L.starters.map(P), nbc = st.filter((p) => p.court === "BC").length, nfc = st.filter((p) => p.court === "FC").length;
  const okCount = L.starters.length === N, okMix = nbc >= (+ro.min_bc_start || 0) && nfc >= (+ro.min_fc_start || 0);
  // panchina = tutti i non titolari, nell'ordine scelto (conta per i cambi automatici)

    ...mine.filter((p) => !L.starters.includes(p.id) && !L.bench.includes(p.id)).sort((a, b) => estFp(b.id) - estFp(a.id)).map((p) => p.id)];
  if (!L.captains.length && L.starters.length) L.captains = [...L.starters, ...L.bench].sort((a, b) => (L.starters.includes(b) - L.starters.includes(a)) || estFp(b) - estFp(a)).slice(0, 5);
  const capNeed = Math.min(+(R().captain || {}).min_list || 5, mine.length);
  let live = new Map(), liveTot = null, liveCap = null;
  if (locked) {
    const lc = (formazioneView.lc ||= {});
    if (!lc[d] || Date.now() - lc[d].at > 60000) lc[d] = { at: Date.now(), rows: await q(sb.from("team_scores").select("points,detail").eq("team_id", S.sess.team_id).eq("game_date", d)) };
    const ts = lc[d].rows;

  }
  const cap = R().captain || {}, mult = +cap.multiplier || 2;

function turnQueue(turn) {
  const size = +(R().roster || {}).size || 10, ts = S.teams, i = ts.findIndex((t) => t.id === turn);
  if (i < 0) return "";

  for (let k = 1; k < ts.length && next.length < 3; k++) { const t = ts[(i + k) % ts.length]; if (rosterOf(t.id).length < size) next.push(t); }
  if (!next.length) return "";
  return `<div class="row" style="gap:6px;margin-top:8px;opacity:.85;font-size:.9rem;flex-wrap:wrap"><span>Poi:</span>${next.map((t, k) => `<span style="display:inline-flex;gap:4px;align-items:center;${t.id === S.sess.team_id ? "color:var(--accent);font-weight:800" : "font-weight:700"}">${teamLogo(t, 18)}${esc(t.id === S.sess.team_id ? "Tu" : t.name)}</span>${k < next.length - 1 ? "<span>→</span>" : ""}`).join("")}</div>`;

const PER_PAGE = 30;

}
function pager(total, page, attr) {

/* timer asta */
let closing = null, wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", () => (wakeLock = null)); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
function tick() {
  const a = S.auction; if (!a || a.status !== "open" || !a.ends_at) return;
  const left = new Date(a.ends_at).getTime() - now();
  const total = (+(R().auction || {}).timer_seconds || 20) * 1000;
  const secs = $("#secs"), bar = $("#tbar"), board = $("#board");
  if (secs) secs.textContent = Math.max(0, Math.ceil(left / 1000));
  if (bar) bar.style.width = Math.max(0, Math.min(100, (left / total) * 100)) + "%";
  if (board) board.classList.toggle("hot", left < 5000);
  if (left <= 0 && closing !== a.ends_at) {
    closing = a.ends_at;
    setTimeout(() => rpc("auction_close", { p_league: S.sess.league_id }).catch(() => {}), 300 + Math.random() * 500);
  }
}
setInterval(tick, 250);

}

}
function maybeOnboard() {
  if (S.onbShown || !S.sess || !S.league || onboardingDone()) return;
  S.onbShown = true;
  const el = document.createElement("div");

function startTour() {
  S.tab = "oggi"; render().then(() => {
    const steps = [
      { sel: '.tab[data-tab="oggi"]', t: "Oggi", d: "I punti della nottata. Tocca una sfida per vedere ogni giocatore." },
      { sel: '.tab[data-tab="formazione"]', t: "Quintetto", d: "Ogni sera 5 titolari, prima della prima partita. Il pallino rosso ti avvisa se c'è un infortunato." },
      { sel: '.tab[data-tab="asta"]', t: isTrade() ? "Trade" : "Asta", d: isTrade() ? "Scambi con gli amici e offerte sui free agent quando il mercato è aperto." : "L'asta si fa da qui, dal telefono. Dopo l'asta diventa Trade: scambi e mercato." },
      { sel: '.tab[data-tab="classifica"]', t: "Classifica", d: "La classifica e le rose di tutte le squadre." },
      { sel: '[data-act="rules"]', t: "Regole", d: "Regole e video sempre qui. Buon divertimento!" },
    ];
    let i = 0;
    const wrap = document.createElement("div"); wrap.className = "tour"; document.body.appendChild(wrap);
    const done = () => { wrap.remove(); removeEventListener("resize", show); finishOnboarding(); };
    function show() {
      const st = steps[i], target = document.querySelector(st.sel);
      if (!target) { i++; return i < steps.length ? show() : done(); }
      const r = target.getBoundingClientRect(), pad = 6, below = r.top < innerHeight / 2;
      const tipW = Math.min(320, innerWidth - 32), left = Math.max(16, Math.min(innerWidth - tipW - 16, r.left + r.width / 2 - tipW / 2));
      wrap.innerHTML = `<div class="tour-hole" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>
        <div class="tour-tip" style="width:${tipW}px;left:${left}px;${below ? `top:${r.bottom + 14}px` : `bottom:${innerHeight - r.top + 14}px`}">
          <div class="row between"><b class="tour-t">${st.t}</b><span class="muted num" style="font-size:.8rem">${i + 1}/${steps.length}</span></div>
          <p style="margin:6px 0 12px">${st.d}</p>
          <div class="row between"><button class="btn small ghost" data-tour="skip">Salta</button><button class="btn small primary" data-tour="next">${i === steps.length - 1 ? "Iniziamo!" : "Avanti"}</button></div></div>`;
    }
    wrap.addEventListener("click", (e) => {
      const b = e.target.closest("[data-tour]"); if (!b) return;
      if (b.dataset.tour === "skip") return done();
      i++; i < steps.length ? show() : done();
    });
    addEventListener("resize", show);
    show();
  });
}

// immagine ridotta a 160×160 (ritaglio centrale), così pesa pochi KB
function shrinkImage(file) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const S2 = 160, c = document.createElement("canvas"); c.width = c.height = S2;
      const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.getContext("2d").drawImage(img, sx, sy, m, m, 0, 0, S2, S2);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("Immagine non leggibile")); };
    img.src = url;
  });
}

function bindCommon() {
  const app = $("#app");
  app.onclick = async (e) => {
    const t = e.target.closest("button,[data-match],[data-team-open]"); if (!t || t.disabled) return;
    const d = t.dataset, tok = S.sess?.token;
    try {
      if (d.day) { S.day = d.day; S.openMatch = null; return render(); }
      if (d.match) { S.openMatch = S.openMatch === +d.match ? null : +d.match; return render(); }
      if (d.teamOpen) { S.openMatch = S.openMatch === d.teamOpen ? null : d.teamOpen; return render(); }
      if (d.lday) { S.lineupDate = d.lday; S.lineup = null; S.luSel = null; return render(); }
      if (d.lu) {
        const L = S.lineup, id = d.id, N = +(R().roster || {}).starters || 5;
        if (d.lu === "s") {
          if (L.starters.includes(id)) { L.starters = L.starters.filter((x) => x !== id); }
          else { if (L.starters.length >= N) return toast(`Hai già ${N} titolari: togline uno prima`, true); L.starters.push(id); L.bench = L.bench.filter((x) => x !== id); }
        } else {
          if (L.bench.includes(id)) L.bench = L.bench.filter((x) => x !== id);
          else { L.bench.push(id); L.starters = L.starters.filter((x) => x !== id); }
        }
        L.dirty = true; return render();
      }
      if ((d.luPick || d.luOut || d.luSlot || d.cap || d.capmv) && S.tab === "formazione" && S.luRO) return toast(me()?.auto_coach ? "Ci pensa il Secondo Allenatore: spegnilo per decidere tu" : "Giornata iniziata: quintetto bloccato");
      if (d.luPick || d.luOut || d.luSlot) {
        const L = S.lineup; if (!L) return;
        const swapIn = (inId, outId) => { const i = L.starters.indexOf(outId), j = L.bench.indexOf(inId); L.starters[i] = inId; L.bench[j] = outId; };
        if (d.luOut) { L.starters = L.starters.filter((x) => x !== d.luOut); L.bench.push(d.luOut); S.luSel = null; L.dirty = true; return render(); }
        if (d.luSlot) {
          if (!S.luSel || L.starters.includes(S.luSel)) return toast("Prima tocca un giocatore della panchina");
          L.starters.push(S.luSel); L.bench = L.bench.filter((x) => x !== S.luSel); S.luSel = null; L.dirty = true; return render();
        }
        const id = d.luPick, a = S.luSel;
        if (!a || a === id) { S.luSel = a === id ? null : id; return render(); }
        const aS = L.starters.includes(a), bS = L.starters.includes(id);
        if (aS && bS) { S.luSel = id; return render(); }
        if (!aS && !bS) { const i = L.bench.indexOf(a), j = L.bench.indexOf(id); [L.bench[i], L.bench[j]] = [L.bench[j], L.bench[i]]; }
        else if (aS) swapIn(id, a); else swapIn(a, id);
        S.luSel = null; L.dirty = true; return render();
      }
      if (d.cap) { const C = S.lineup.captains, i = C.indexOf(d.cap); i >= 0 ? C.splice(i, 1) : C.push(d.cap); S.lineup.dirty = true; return render(); }
      if (d.capmv) { const C = S.lineup.captains, i = C.indexOf(d.capmv), j = i + +d.dir; if (i < 0 || j < 0 || j >= C.length) return; [C[i], C[j]] = [C[j], C[i]]; S.lineup.dirty = true; return render(); }
      if (d.court !== undefined) { S.court = d.court; S.page = 0; return render(); }
      if (d.nom) { await rpc("auction_nominate", { p_token: tok, p_player: d.nom, p_start: startOf(d.nom) }); return; }
      if (d.bid) { await rpc("auction_bid", { p_token: tok, p_amount: +d.bid }); return; }
      if (d.admAuction) { await rpc("admin_auction", { p_token: tok, p_action: d.admAuction, p_team: null }); return; }
      if (d.pin) { const v = ($("#pin-" + d.pin).value || "").trim(); await rpc("admin_team", { p_token: tok, p_team: d.pin, p_action: "reset_pin", p_value: { pin: v } }); toast(`Nuovo PIN per ${teamName(d.pin)}: ${v}`); return; }
      if (d.adj) { await rpc("admin_team", { p_token: tok, p_team: d.adj, p_action: "credit_adjust", p_value: { value: +$("#adj-" + d.adj).value || 0 } }); toast("Crediti aggiornati"); return; }
      if (d.tg) { const M = S.mk, arr = M[d.tg]; const i = arr.indexOf(d.id); i >= 0 ? arr.splice(i, 1) : arr.push(d.id); return render(); }
      if (d.fac !== undefined) { S.mk.faCourt = d.fac; S.mk.faPage = 0; return render(); }
      if (d.fav) {
        const id = d.fav, on = !S.favs.has(id);
        on ? S.favs.add(id) : S.favs.delete(id); render();
        try { await rpc("toggle_favorite", { p_token: tok, p_player: id }); } catch (err) { on ? S.favs.delete(id) : S.favs.add(id); render(); throw err; }
        return;
      }
      if (d.lshape) { Object.assign(logoState(), { shape: d.lshape, dirty: true }); return render(); }
      if (d.lc1) { Object.assign(logoState(), { c1: d.lc1, dirty: true }); return render(); }
      if (d.lc2) { Object.assign(logoState(), { c2: d.lc2, dirty: true }); return render(); }
      if (d.pool) { Object.assign(S.mk, { pool: d.pool, faPage: 0, fa: null }); return render(); }
      if (d.band !== undefined) { S.band = d.band; S.page = 0; return render(); }
      if (d.faband !== undefined) { S.mk.faBand = d.faband; S.mk.faPage = 0; return render(); }
      if (d.page !== undefined) { S.page = +d.page; await render(); return $("#pl-list")?.scrollIntoView({ block: "start" }); }
      if (d.fapage !== undefined) { S.mk.faPage = +d.fapage; await render(); return $("#fa-list")?.scrollIntoView({ block: "start" }); }
      switch (d.act) {
        case "no-install": store.set("fantanba.noinstall", 1); return render();
        case "logo-noimg": Object.assign(logoState(), { img: "", dirty: true }); return render();
        case "logo-save": {
          const L = logoState();
          await rpc("set_logo", { p_token: tok, p_logo: { shape: L.shape, c1: L.c1, c2: L.c2, txt: (L.txt || "").toUpperCase().slice(0, 3) }, p_img: L.img || null });
          L.dirty = false; Object.assign(me(), { logo: { shape: L.shape, c1: L.c1, c2: L.c2, txt: (L.txt || "").toUpperCase().slice(0, 3) }, logo_img: L.img || null });
          toast("Logo salvato"); render(); loadLeague().then(render).catch(() => {}); return;
        }
        case "only-fav": S.onlyFav = !S.onlyFav; S.page = 0; S.mk.faPage = 0; return render();
        case "new-trade": S.mk.newTrade = !S.mk.newTrade; return render();
        case "trade-for": { Object.assign(S.mk, { newTrade: true, tradeTo: d.team, get: [d.pid], give: [] }); await render(); return $("#trade-builder")?.scrollIntoView({ block: "start", behavior: "smooth" }); }
        case "rules": S.prevTab = S.tab; S.tab = "regole"; render(); return window.scrollTo(0, 0);
        case "rules-back": S.tab = S.prevTab || "oggi"; render(); return window.scrollTo(0, 0);
        case "send-trade": {
          const M = S.mk;
          await rpc("propose_trade", { p_token: tok, p_to: M.tradeTo, p_give: M.give, p_get: M.get, p_give_credits: +M.givec || 0, p_get_credits: +M.getc || 0, p_message: M.msg });
          Object.assign(M, { give: [], get: [], givec: 0, getc: 0, msg: "", newTrade: false }); toast("Proposta inviata"); return render();
        }
        case "tr-accept": { await rpc("respond_trade", { p_token: tok, p_trade: +d.tid, p_accept: true }); toast("Scambio fatto"); return render(); }
        case "tr-reject": { await rpc("respond_trade", { p_token: tok, p_trade: +d.tid, p_accept: false }); toast("Proposta rifiutata"); return render(); }
        case "tr-cancel": { await rpc("cancel_trade", { p_token: tok, p_trade: +d.tid }); toast("Proposta ritirata"); return render(); }
        case "rel-ask": S.mk.rel = d.pid; return render();
        case "rel-no": S.mk.rel = null; return render();
        case "rel-yes": { const r = await rpc("market_release", { p_token: tok, p_player: d.pid }); S.mk.rel = null; S.lineup = null; toast(`Rilasciato: +${r} crediti`); return render(); }
        case "fa-open": Object.assign(S.mk, { fa: d.pid, faAmt: "", faDrop: "" }); return render();
        case "fa-edit": Object.assign(S.mk, { fa: d.pid, faAmt: d.amt, faDrop: d.drop, faSearch: P(d.pid).name }); return render();
        case "fa-close": S.mk.fa = null; return render();
        case "fa-send": { await rpc("fa_bid", { p_token: tok, p_player: d.pid, p_amount: +$("#fa-amt").value, p_drop: $("#fa-drop").value || null }); S.mk.fa = null; toast("Offerta in busta"); return render(); }
        case "fa-withdraw": { await rpc("fa_withdraw", { p_token: tok, p_bid: +d.wd }); toast("Offerta ritirata"); return render(); }
        case "win-create": {
          const o = $("#win-open").value, c = $("#win-close").value; if (!o || !c) return toast("Scegli apertura e chiusura", true);
          await rpc("admin_window", { p_token: tok, p_action: "create", p_opens: new Date(o).toISOString(), p_closes: new Date(c).toISOString(), p_id: null }); toast("Finestra programmata"); return render();
        }
        case "win-close": { const r = await rpc("admin_window", { p_token: tok, p_action: "close_now", p_opens: null, p_closes: null, p_id: +d.wid }); await loadLeague(); toast(`Finestra chiusa: ${r?.signed ?? 0} acquisti`); return render(); }
        case "win-cancel": { await rpc("admin_window", { p_token: tok, p_action: "cancel", p_opens: null, p_closes: null, p_id: +d.wid }); toast("Finestra annullata"); return render(); }
        case "recompute": { const r = await rpc("admin_window", { p_token: tok, p_action: "recompute_values", p_opens: null, p_closes: null, p_id: null }); toast(`Quotazioni aggiornate (${r.players} giocatori)`); return; }
        case "bid-custom": { const v = +$("#bid-custom").value; if (!v) return; await rpc("auction_bid", { p_token: tok, p_amount: v }); break; }
        case "set-turn": await rpc("admin_auction", { p_token: tok, p_action: "set_turn", p_team: $("#turn-sel").value }); toast("Turno aggiornato"); break;
        case "auto-coach": {
          const on = !me()?.auto_coach;
          await rpc("set_auto_coach", { p_token: tok, p_on: on });
          me().auto_coach = on; S.lineup = null; S.luSel = null;
          toast(on ? "Secondo Allenatore attivo: da ora sceglie lui" : "Secondo Allenatore spento: decidi tu"); return render();
        }
        case "save-lineup": {
          const L = S.lineup;
          const capOn = (R().captain || {}).enabled, need = Math.min(+(R().captain || {}).min_list || 5, rosterOf(S.sess.team_id).length);
          if (capOn && L.captains.length < need) return toast(`Scegli almeno ${need} capitani in ordine`, true);
          await rpc("set_lineup", { p_token: tok, p_date: L.date, p_starters: L.starters, p_bench: L.bench, p_captain: L.captains[0] || null, p_captains: capOn ? L.captains : [] });
          L.savedFor = L.date; L.dirty = false; S.myStarters = [...L.starters]; toast("Quintetto salvato per " + fmtDay(L.date)); render(); break;
        }
        case "release": {
          const box = $("#rel-confirm"), pid = $("#rel-p").value;
          box.innerHTML = `<div class="row" style="margin-top:8px"><span class="grow">Svincolare davvero ${esc(P(pid).name)}?</span><button class="btn small danger" data-act="release-yes" data-pid="${pid}">Sì, svincola</button><button class="btn small" data-act="release-no">No</button></div>`; break;
        }
        case "release-yes": await rpc("release_player", { p_token: tok, p_player: d.pid }); S.lineup = null; toast("Giocatore svincolato"); break;
        case "release-no": $("#rel-confirm").innerHTML = ""; break;
        case "copy-code": {
          const link = location.href.split(/[?#]/)[0] + "?lega=" + S.league.code;
          const txt = `Entra nella mia lega NBA Dream League "${S.league.name}"! Apri ${link} , scegli il nome della tua squadra e un PIN.`;
          try { await navigator.clipboard.writeText(txt); toast("Invito copiato"); } catch { const r = document.createRange(); r.selectNodeContents($("#code-txt")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Copia il codice selezionato"); }
          break;
        }
        case "save-league":
          await rpc("admin_update_league", { p_token: tok, p_patch: { status: $("#lg-status").value, mode: $("#lg-mode2").value, season_start: $("#lg-start").value || null, name: $("#lg-name2").value.trim() || S.league.name } });
          toast("Lega aggiornata"); break;
        case "save-rules": {
          const patch = {};
          app.querySelectorAll("[data-rule]").forEach((inp) => {
            const keys = inp.dataset.rule.split("."); let o = patch;
            keys.slice(0, -1).forEach((k) => (o = o[k] = o[k] || {}));
            o[keys[keys.length - 1]] = inp.dataset.type === "bool" ? inp.checked : +inp.value;
          });
          if (patch.roster && patch.roster.bc + patch.roster.fc !== patch.roster.size) return toast("BC + FC deve essere uguale ai giocatori in rosa", true);
          await rpc("admin_update_league", { p_token: tok, p_patch: { rules: patch } }); toast("Regole salvate"); break;
        }
        case "gen-schedule": { const n = await rpc("admin_generate_schedule", { p_token: tok }); toast(`Calendario creato: ${n} sfide`); break; }
        case "gen-playoffs": { const v = $("#po-start").value; if (!v) return toast("Scegli la data di inizio playoff", true); const n = await rpc("admin_generate_playoffs", { p_token: tok, p_start: v }); toast(`Playoff creati (${n} sfide)`); break; }
        case "next-round": { const v = $("#po-start").value; if (!v) return toast("Scegli la data di inizio del nuovo turno", true); const n = await rpc("admin_next_playoff_round", { p_token: tok, p_start: v }); toast(`Turno successivo creato (${n} sfide)`); break; }
        case "assign": case "unassign": {
          const name = $("#as-name").value.trim().toLowerCase(); const p = [...S.players.values()].find((x) => x.name.toLowerCase() === name);
          if (!p) return toast("Giocatore non trovato: scegli dal suggerimento", true);
          if (d.act === "assign") { await rpc("admin_team", { p_token: tok, p_team: $("#as-team").value, p_action: "assign_player", p_value: { player_id: p.id, price: +$("#as-price").value || 1 } }); toast(p.name + " assegnato"); }
          else $("#as-confirm").innerHTML = `<div class="row" style="margin-top:8px"><span class="grow">Togliere ${esc(p.name)} dalla sua rosa? I crediti tornano alla squadra.</span><button class="btn small danger" data-act="unassign-yes" data-pid="${p.id}">Sì, togli</button><button class="btn small" data-act="unassign-no">No</button></div>`;
          break;
        }
        case "unassign-yes": { const owner = S.roster.find((r) => r.player_id === d.pid); await rpc("admin_team", { p_token: tok, p_team: owner?.team_id || S.teams[0].id, p_action: "remove_player", p_value: { player_id: d.pid } }); toast("Giocatore tolto"); $("#as-confirm").innerHTML = ""; break; }
        case "unassign-no": $("#as-confirm").innerHTML = ""; break;
        case "del-team": $("#del-" + d.tid).innerHTML = `<div class="row" style="margin-top:8px"><span class="grow">Eliminare <b>${esc(teamName(d.tid))}</b>? Non si può annullare: l'amico dovrà iscriversi di nuovo.</span><button class="btn small danger" data-act="del-team-yes" data-tid="${d.tid}">Sì, elimina</button><button class="btn small" data-act="del-team-no" data-tid="${d.tid}">No</button></div>`; break;
        case "del-team-no": $("#del-" + d.tid).innerHTML = ""; break;
        case "del-team-yes": { const n = teamName(d.tid); await rpc("admin_team", { p_token: tok, p_team: d.tid, p_action: "delete_team" }); await loadLeague(); render(); toast(n + " eliminata"); break; }
        case "logout": store.del("fantanba.sess"); S.sess = null; S.league = null; if (channel) sb.removeChannel(channel); render(); break;
      }
    } catch (err) {
      toast(err.message, true);
      if (/già preso|non è un free agent/i.test(err.message)) { try { await reloadRoster(); render(); } catch {} }
    }
  };
  const ps = $("#pl-search");
  if (ps) ps.oninput = () => { S.search = ps.value; S.page = 0; const pos = ps.selectionStart; render().then(() => { const n = $("#pl-search"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); };
  app.oninput = (e) => {
    const id = e.target.id, M = S.mk;
    if (id === "logo-txt") {
      const L = logoState(); L.txt = e.target.value.toUpperCase().slice(0, 3); L.dirty = true;
      $("#logo-prev").innerHTML = logoPreview(L, 92);
      const b = app.querySelector('[data-act="logo-save"]'); if (b) { b.disabled = false; b.textContent = "Salva logo"; }
      return;
    }
    if (id === "tr-givec" || id === "tr-getc") { M[id === "tr-givec" ? "givec" : "getc"] = e.target.value; const el = $("#tr-sum"); if (el) el.textContent = `Quotazioni: dai ${M.give.reduce((a, x) => a + val(x), 0)} + ${+M.givec || 0} cr · ricevi ${M.get.reduce((a, x) => a + val(x), 0)} + ${+M.getc || 0} cr`; } else if (id === "tr-msg") M.msg = e.target.value;
    else if (id === "fa-amt") M.faAmt = e.target.value;
    else if (id === "fa-search") { M.faSearch = e.target.value; M.faPage = 0; const pos = e.target.selectionStart; render().then(() => { const n = $("#fa-search"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }
  };
  app.onchange = async (e) => {
    if (e.target.id === "logo-file" && e.target.files?.[0]) {
      try { Object.assign(logoState(), { img: await shrinkImage(e.target.files[0]), dirty: true }); render(); } catch (err) { toast(err.message, true); }
      return;
    }
    if (e.target.id === "tr-team") { Object.assign(S.mk, { tradeTo: e.target.value, get: [] }); render(); }
    else if (e.target.id === "fa-drop") S.mk.faDrop = e.target.value;
  };
  const of = $("#only-free"); if (of) of.onchange = () => { S.onlyFree = of.checked; S.page = 0; render(); };
  app.onkeydown = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-match],[data-team-open]")) { e.preventDefault(); e.target.click(); } };
}

/* ---------- avvio ---------- */
(async function boot() {
  try {
    await loadStatic();
    if (S.sess) {
      try { await loadLeague(); subscribe(); }
      catch { store.del("fantanba.sess"); S.sess = null; S.league = null; }
    }
  } catch (e) { $("#app").innerHTML = `<div class="empty">Non riesco a collegarmi al server. Controlla la connessione e ricarica.<br><small>${esc(e.message)}</small></div>`; return; }
  render();
  // ricarica dati ogni 2 minuti per punteggi e infortuni
  await loadMyStarters(); renderTabs();
  setInterval(async () => { if (!S.sess || !S.league) return; if (S.tab === "oggi" || S.tab === "classifica") render(); }, 120000);
  setInterval(async () => { if (!S.sess || !S.league) return; await refreshInjuries(); await loadMyStarters(); if (S.tab === "formazione") render(); else renderTabs(); }, 600000);
  document.addEventListener("visibilitychange", async () => { if (!document.hidden && S.sess && S.league) { try { S.defaultDay = null; if (S.tab === "oggi") S.day = null; await loadLeague(); await loadBids(); await refreshInjuries(); await loadMyStarters(); render(); } catch {} } });
})();
</script>
</body>
</html>
